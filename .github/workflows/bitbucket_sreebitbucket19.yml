name: Trigger Bitbucket Pipeline
on:
  workflow_dispatch: # Manual trigger

permissions:
  contents: write    # Needed to read/write code
  actions: write     # Mandatory to trigger/manage workflows
  statuses: write    # Optional: to update commit checkmarks

jobs:
  trigger-bitbucket:
    runs-on: ubuntu-latest
    steps:
      - name: Call Bitbucket API (Debug Mode)
        run: |
          curl -i -sS -X POST \
            -u "${{ secrets.BITBUCKET_USERNAME }}:${{ secrets.BITBUCKET_APP_PASSWORD }}" \
            -H "Content-Type: application/json" \
            "https://api.bitbucket.org/2.0/repositories/sreebitbucket19/first_repo/pipelines/" \
            -d '{
              "target": {
                "ref_type": "branch",
                "type": "pipeline_ref_target",
                "ref_name": "main"
              }
            }'