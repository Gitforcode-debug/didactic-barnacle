name: Go Movies CRUD 1 (polyglot goeval bridges)

# Exercises golang/6_go_movies_crud_1/ — three polyglot entry points that all
# end up spinning the same gorilla/mux REST server on :8080 via `goeval`:
#   * main_2.py   — Python  -> subprocess.run(["goeval", ...])
#   * main_2.js   — Node    -> child_process.execFile("python", ["-c", ...])
#                               -> subprocess.run(["goeval", ...])
#   * main_3.go   — Go      -> os/exec        -> python -c -> subprocess
#                               -> goeval
# Each entry point is launched in turn, hit with the same 5-endpoint CRUD
# curl battery, asserted with jq, then torn down before the next runs.

on:
  # push:
  #   branches:
  #     - main
  # pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python
            launcher: python main_2.py
          - name: node
            launcher: node main_2.js
          - name: go
            launcher: go run main_3.go

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      # -----------------------------------------------------------------------
      # NEW STEP: Clone the external programming_languages repository
      # -----------------------------------------------------------------------
      - name: Clone programming_languages repository
        uses: actions/checkout@v4
        with:
          # Replace 'YOUR_USERNAME_OR_ORG' with your actual GitHub username or organization
          repository: 'aqwertyuiop48/programming_languages'
          
          # Clones directly into the root workspace so './golang' aligns perfectly
          path: .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install goeval (clone + go install)
        run: |
          git clone https://github.com/dolmen-go/goeval.git /tmp/goeval
          cd /tmp/goeval
          go install .

      - name: Add Go bin directory to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify goeval installation
        run: |
          which goeval
          goeval -i fmt 'fmt.Println("goeval OK")'

      - name: Install Node.js helper dependency (sprintf-js)
        working-directory: ./golang/6_go_movies_crud_1
        if: matrix.name == 'node'
        run: npm install sprintf-js

      - name: Install Go module dependencies (gorilla/mux for goeval)
        working-directory: ./golang/6_go_movies_crud_1
        run: |
          go mod tidy
          go mod download
          # goeval reads the same GOPATH; ensure gorilla/mux is fetched into
          # the module cache so it can resolve the import inside the eval'd snippet.
          go get github.com/gorilla/mux@v1.8.0 || true

      - name: Start ${{ matrix.name }} entry point in background
        working-directory: ./golang/6_go_movies_crud_1
        run: |
          mkdir -p ../../crud_out_${{ matrix.name }}
          nohup ${{ matrix.launcher }} > ../../crud_out_${{ matrix.name }}/launcher.log 2>&1 &
          echo $! > /tmp/launcher_pid
          # Wait up to 60 s for :8080 to accept connections
          # (goeval first compiles the embedded snippet, which can take ~20-40 s)
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/movies >/dev/null 2>&1; then
              echo "Server is up after ${i}s (entry: ${{ matrix.name }})"
              break
            fi
            sleep 1
          done
          # Final readiness probe — if this fails the next step will surface the
          # error with a non-zero curl exit code.
          curl -fsS http://localhost:8080/movies >/dev/null

      - name: Exercise all 5 CRUD endpoints with curl
        run: |
          out=crud_out_${{ matrix.name }}
          mkdir -p "$out"

          echo "=== GET /movies (initial seed: 2 movies) ==="
          curl -sS -o "$out/01_get_all.json" -w "HTTP %{http_code}\n" http://localhost:8080/movies
          cat "$out/01_get_all.json"; echo

          echo "=== GET /movies/1 (single record) ==="
          curl -sS -o "$out/02_get_one.json" -w "HTTP %{http_code}\n" http://localhost:8080/movies/1
          cat "$out/02_get_one.json"; echo

          echo "=== POST /movies (create) ==="
          curl -sS -o "$out/03_post_create.json" -w "HTTP %{http_code}\n" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"isbn":"99999","title":"Movie Three","director":{"firstname":"Ada","lastname":"Lovelace"}}' \
            http://localhost:8080/movies
          cat "$out/03_post_create.json"; echo

          echo "=== PUT /movies/1 (update) ==="
          curl -sS -o "$out/04_put_update.json" -w "HTTP %{http_code}\n" \
            -H "Content-Type: application/json" \
            -X PUT \
            -d '{"isbn":"438227-v2","title":"Movie One (Updated)","director":{"firstname":"John","lastname":"Doe"}}' \
            http://localhost:8080/movies/1
          cat "$out/04_put_update.json"; echo

          echo "=== DELETE /movies/2 ==="
          curl -sS -o "$out/05_delete.json" -w "HTTP %{http_code}\n" \
            -X DELETE http://localhost:8080/movies/2
          cat "$out/05_delete.json"; echo

          echo "=== GET /movies (final state after CRUD ops) ==="
          curl -sS -o "$out/06_get_final.json" -w "HTTP %{http_code}\n" http://localhost:8080/movies
          cat "$out/06_get_final.json"; echo

      - name: Assert CRUD results
        run: |
          out=crud_out_${{ matrix.name }}
          test "$(jq 'length' $out/01_get_all.json)" = "2"
          test "$(jq -r '.title' $out/02_get_one.json)" = "Movie One"
          test "$(jq -r '.title' $out/03_post_create.json)" = "Movie Three"
          test "$(jq -r '.title' $out/04_put_update.json)" = "Movie One (Updated)"
          test "$(jq 'length' $out/06_get_final.json)" = "2"
          ! jq -e '.[] | select(.id == "2")' $out/06_get_final.json
          echo "All CRUD assertions passed for entry point: ${{ matrix.name }}"

      - name: Stop background processes (launcher + goeval + python/node/go children)
        if: always()
        run: |
          if [ -f /tmp/launcher_pid ]; then
            kill "$(cat /tmp/launcher_pid)" 2>/dev/null || true
          fi
          # Tear down every link in the polyglot chain
          pkill -f "goeval" 2>/dev/null || true
          pkill -f "main_2.py" 2>/dev/null || true
          pkill -f "main_2.js" 2>/dev/null || true
          pkill -f "main_3.go" 2>/dev/null || true
          pkill -f "/tmp/go-build" 2>/dev/null || true

      - name: Show launcher log tail
        if: always()
        run: |
          log=crud_out_${{ matrix.name }}/launcher.log
          if [ -f "$log" ]; then
            echo "--- last 80 lines of $log ---"
            tail -n 80 "$log"
          fi

      - name: Upload CRUD JSON artifacts (per entry point)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-movies-crud-1-${{ matrix.name }}-artifacts
          path: |
            crud_out_${{ matrix.name }}/
