name: Go TCP Socket Server + Client (paired go run)

# Exercises golang/5_socket_programming/ — paired Go programs where one
# binds a TCP listener and the other dials it. Matrix runs both pairs:
#   * pair1: server.go (:9988)   + client.go    — single request/response
#   * pair2: server_2.go (:8000) + client_2.go  — streaming numbered lines
#
# For each pair the workflow:
#   1. Backgrounds the server with `nohup go run server.go &`
#   2. Waits for the configured TCP port to accept connections
#   3. Runs the client (timeboxed for the streaming variant)
#   4. Asserts the expected exchange happened in server.log / client.log
#   5. Tears down the server, uploads both logs as artifacts

on:
  # push:
  #   branches:
  #     - main
  # pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pair1
            server_file: server.go
            client_file: client.go
            port: 9988
            client_timeout: 0          # client exits on its own
            server_expect: "Received:  Hello Server! Greetings."
            client_expect: "Thanks! Got your message:Hello Server! Greetings."
          - name: pair2
            server_file: server_2.go
            client_file: client_2.go
            port: 8000
            client_timeout: 5          # streaming — kill after 5 s
            server_expect: "data from server"
            client_expect: "data from server"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      # -----------------------------------------------------------------------
      # NEW STEP: Clone the external programming_languages repository
      # -----------------------------------------------------------------------
      - name: Clone programming_languages repository
        uses: actions/checkout@v4
        with:
          # Replace 'YOUR_USERNAME_OR_ORG' with your actual GitHub username or organization
          repository: 'aqwertyuiop48/programming_languages'
          
          # Clones directly into the root workspace so './golang' aligns perfectly
          path: .
          
          # REQUIRED ONLY IF THE REPOSITORY IS PRIVATE:
          # Uncomment the line below and use a Personal Access Token (PAT) saved in secrets
          # token: ${{ secrets.YOUR_PERSONAL_ACCESS_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Prepare output dir
        run: mkdir -p socket_out_${{ matrix.name }}

      - name: Start TCP server in background (${{ matrix.server_file }} on :${{ matrix.port }})
        working-directory: ./golang/5_socket_programming
        run: |
          out=../../socket_out_${{ matrix.name }}
          nohup go run ${{ matrix.server_file }} > "$out/server.log" 2>&1 &
          echo $! > /tmp/server_pid_${{ matrix.name }}
          # Wait up to 60 s for the server port to start accepting connections
          # (cold `go run` compile of server.go takes ~20 s on fresh runners)
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/${{ matrix.port }}) >/dev/null 2>&1; then
              echo "Server is listening on :${{ matrix.port }} after ${i}s"
              break
            fi
            sleep 1
          done
          # Final readiness probe — fail the step if it never came up
          (echo > /dev/tcp/127.0.0.1/${{ matrix.port }}) 2>/dev/null

      - name: Run TCP client (${{ matrix.client_file }})
        working-directory: ./golang/5_socket_programming
        run: |
          out=../../socket_out_${{ matrix.name }}
          if [ "${{ matrix.client_timeout }}" -gt 0 ]; then
            # Streaming client — timebox the run
            timeout --preserve-status -s INT ${{ matrix.client_timeout }} \
              go run ${{ matrix.client_file }} > "$out/client.log" 2>&1 || true
          else
            go run ${{ matrix.client_file }} > "$out/client.log" 2>&1
          fi
          echo "--- client.log ---"
          cat "$out/client.log"

      - name: Assert exchange happened
        run: |
          out=socket_out_${{ matrix.name }}
          echo "--- server.log ---"
          cat "$out/server.log"
          echo
          echo "Asserting server saw: ${{ matrix.server_expect }}"
          grep -F "${{ matrix.server_expect }}" "$out/server.log"
          echo "Asserting client saw: ${{ matrix.client_expect }}"
          grep -F "${{ matrix.client_expect }}" "$out/client.log"
          echo "TCP exchange OK for ${{ matrix.name }}"

      - name: Stop background TCP server
        if: always()
        run: |
          if [ -f /tmp/server_pid_${{ matrix.name }} ]; then
            kill "$(cat /tmp/server_pid_${{ matrix.name }})" 2>/dev/null || true
          fi
          pkill -f "go run ${{ matrix.server_file }}" 2>/dev/null || true
          pkill -f "/tmp/go-build" 2>/dev/null || true

      - name: Upload TCP exchange logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-socket-${{ matrix.name }}-artifacts
          path: |
            socket_out_${{ matrix.name }}/
