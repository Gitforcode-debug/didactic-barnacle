name: Robot Framework

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  robot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Current Repository
      uses: actions/checkout@v4

    # -----------------------------------------------------------------------
    # NEW STEP: Clone the external programming_languages repository
    # -----------------------------------------------------------------------
    - name: Clone programming_languages repository
      uses: actions/checkout@v4
      with:
        # Replace 'YOUR_USERNAME_OR_ORG' with your actual GitHub username or organization
        repository: 'aqwertyuiop48/programming_languages'
        
        # Clones directly into the root workspace so './Python' aligns perfectly
        path: .

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Robot Framework dependencies
      working-directory: ./Python/robot_
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        robot --version || true

    - name: Run robot search_test.robot
      working-directory: ./Python/robot_
      run: |
        robot --outputdir robot_out search_test.robot

    - name: Assert PASS in report
      working-directory: ./Python/robot_
      run: |
        test -f robot_out/output.xml
        test -f robot_out/log.html
        test -f robot_out/report.html
        grep -F 'Test Robot Get Data' robot_out/output.xml
        grep -F 'status="PASS"' robot_out/output.xml

    - name: Upload Robot artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-framework-artifacts
        path: Python/robot_/robot_out/
