name: Run PyGithub Script

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for trigger'
        required: false

permissions:
  contents: write    # Needed to read/write code
  actions: write     # Mandatory to trigger/manage workflows
  statuses: write    # Optional: to update commit checkmarks

jobs:
  python-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyGithub
        run: pip install PyGithub

      - name: Run the Python Script
        env:
          # This maps your GitHub Secret to the environment variable the script expects
          MY_SECRET_TOKEN: ${{ secrets.PAT_TOKEN_1 }}
        run: python script.py
